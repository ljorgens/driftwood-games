# Render Blueprint: the Driftwood Games website, a FREE static site.
# There is no build step: Render serves the public/ folder as is.
#
# One-time setup: render.com → New → Blueprint → pick this repo → Apply.
# The service name below gives the address https://driftwood-games.onrender.com.
# Every push to main then redeploys automatically.
services:
  - type: web
    name: driftwood-games
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      # Pages, styles and scripts keep Render's default (browsers re-check them).
      # Fonts and clips change rarely; rename a file if you ever replace it.
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /games/*
        name: Cache-Control
        value: public, max-age=86400
      # The site loads nothing from other sites, so the CSP can be strict.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://formspree.io; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
